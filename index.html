<!doctype html>
<html>
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IBKR Steuerbericht - Anlage KAP</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
</head>
<body>
    <div id="root"></div>
    <script type="module">
        import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
        mount({
            requirements: ["openpyxl"],
            entrypoint: "app.py",
            files: {
                "app.py": { url: "./app.py" },
                "extract_ibkr_data.py": { url: "./extract_ibkr_data.py" },
                "calculate_tax_report.py": { url: "./calculate_tax_report.py" },
                "etf_classification.py": { url: "./etf_classification.py" },
                "ecb_rates.py": { url: "./ecb_rates.py" },
                "ui_model.py": { url: "./ui_model.py" }
            },
            streamlitConfig: {
                "client.toolbarMode": "minimal",
                "theme.base": "dark",
                "theme.primaryColor": "#7aa5f8",
                "theme.backgroundColor": "#0c0e12",
                "theme.secondaryBackgroundColor": "#151924",
                "theme.textColor": "#eef1f6"
            }
        }, document.getElementById("root"));
    </script>
</body>
</html>
